const state = {
    start: '',
    end: '',
    enabled: new Set(store.get('fp:comps', COMPETITIONS.filter(c => c.big).map(c => c.slug)).filter(s => COMP_BY_SLUG[s])),
    raw: new Map(),        // slug -> ESPN events for the current range
    loading: new Set(),
    failed: new Map(),     // slug -> error message
    day: null,             // selected day chip, or null for all
    search: '',
    inView: store.get('fp:inView', false),
    tzMode: store.get('fp:tz', 'venue'),
    selectedId: null,
    loadToken: 0,
    geocodePending: 0,
    near: store.get('fp:near', null),       // { name, lat, lng } or null
    radius: store.get('fp:radius', 100),     // km
    sort: store.get('fp:sort', 'time'),      // 'time' | 'distance' (only while a place is set)
    tab: 'all',                              // 'all' | 'shortlist'
    starred: new Map(store.get('fp:starred', []).map(s => [s.id, s])), // id -> snapshot
    pendingStars: new Set(),                 // ids from a shared link, filled in once their matches load
};

let map, cluster, tileLayer, nearLayer, routeLayer;
const markerById = new Map();

/* =====================================================================
 * Data loading
 * =================================================================== */

async function loadFixtures() {
    const token = ++state.loadToken;
    dayRequests.clear();
    // ESPN days follow US time, so a European kick-off can sit on the previous ESPN day.
    const days = [];
    for (let d = addDays(state.start, -1); d <= state.end; d = addDays(d, 1)) days.push(d);

    // Restart anything a superseded load left half-finished, plus newly enabled competitions.
    const comps = COMPETITIONS.filter(c => state.enabled.has(c.slug) && (!state.raw.has(c.slug) || state.loading.has(c.slug)));
    const pending = new Map(comps.map(c => [c.slug, days.length]));
    const collected = new Map(comps.map(c => [c.slug, []]));
    state.loading.clear();
    comps.forEach(c => { state.loading.add(c.slug); state.failed.delete(c.slug); state.raw.delete(c.slug); });
    render();

    // Interleave competitions so every league starts showing results early.
    const tasks = days.flatMap(day => comps.map(comp => ({ comp, day })));
    await runPool(tasks, FETCH_CONCURRENCY, async ({ comp, day }) => {
        if (token !== state.loadToken || state.failed.has(comp.slug)) return;
        try {
            const events = await fetchDay(comp, day);
            if (token !== state.loadToken) return;
            collected.get(comp.slug).push(...events);
            state.raw.set(comp.slug, collected.get(comp.slug));
        } catch (err) {
            if (token !== state.loadToken) return;
            state.failed.set(comp.slug, err.message || 'failed'); // skip this league's remaining days
            state.raw.delete(comp.slug);
            state.loading.delete(comp.slug);
        }
        const left = pending.get(comp.slug) - 1;
        pending.set(comp.slug, left);
        if (left === 0 && !state.failed.has(comp.slug)) state.loading.delete(comp.slug);
        scheduleRender();
    });
    if (token === state.loadToken) geocodeMissing();
}

function resetAndLoad() {
    state.raw.clear();
    state.failed.clear();
    state.loading.clear();
    state.day = null;
    loadFixtures();
}

function retryFailed() {
    const slugs = [...state.failed.keys()];
    slugs.forEach(s => { state.failed.delete(s); state.raw.delete(s); });
    // Drop cached copies so a retry really goes to the network.
    slugs.forEach(s => {
        for (let d = addDays(state.start, -1); d <= state.end; d = addDays(d, 1)) {
            try { localStorage.removeItem(fixturesCacheKey(s, d)); } catch {}
        }
    });
    loadFixtures();
}

async function geocodeMissing() {
    const seen = new Set();
    const venues = [];
    for (const m of allMatches()) {
        if (!m.venue.name && !m.venue.city) continue;
        const k = venueKey(m.venue);
        if (seen.has(k) || cachedGeo(k) !== undefined) continue;
        seen.add(k);
        venues.push(m.venue);
    }
    if (!venues.length) return;
    state.geocodePending += venues.length;
    renderStatus();

    // Cities first: far fewer lookups (many clubs share one), and every match gets a provisional pin quickly.
    // With the backend, venue lookups are usually instant CDN hits, so skip this step.
    const cities = new Map();
    if (apiMode !== 'on') {
        venues.filter(v => v.city && cachedGeo(cityKey(v)) === undefined).forEach(v => cities.set(cityKey(v), v));
    }
    await Promise.all([...cities.values()].map(v => geocodeCity(v).catch(() => null).finally(scheduleRender)));

    await Promise.all(venues.map(v => geocodeVenue(v).finally(() => {
        state.geocodePending--;
        scheduleRender();
    })));
}

/* =====================================================================
 * Derived data
 * =================================================================== */

function displayZone(m) {
    return state.tzMode === 'mine' ? MY_TZ : m.tz;
}

// With no confirmed time, ESPN's placeholder hour is meaningless, so use its calendar date as-is
// rather than letting a time-zone shift push the match onto the neighbouring day.
function matchDay(m, tz) {
    return m.timeValid ? dayInZone(m.kickoff, tz) : m.kickoff.toISOString().slice(0, 10);
}

function allMatches() {
    const out = [];
    const seen = new Set();
    for (const [slug, events] of state.raw) {
        const comp = COMP_BY_SLUG[slug];
        if (!comp || !state.enabled.has(slug)) continue;
        for (const ev of events) {
            const m = normalizeEvent(ev, comp);
            if (!m || seen.has(m.id)) continue;
            seen.add(m.id);
            m.loc = locationFor(m.venue);
            m.tz = venueTimeZone(m.venue.country, m.loc && m.loc.lng);
            // Keep only matches whose local calendar day falls in the chosen window.
            m.localDay = matchDay(m, m.tz);
            if (m.localDay < state.start || m.localDay > state.end) continue;
            m.day = matchDay(m, displayZone(m));
            out.push(m);
        }
    }
    out.sort((a, b) => a.kickoff - b.kickoff || a.comp.short.localeCompare(b.comp.short));
    return out;
}

function matchesSearch(m, q) {
    if (!q) return true;
    const hay = [m.home.name, m.away.name, m.home.short, m.away.short, m.venue.name, m.venue.city, m.venue.country, m.comp.name, m.comp.short]
        .join(' ').toLowerCase();
    return q.split(/\s+/).every(term => hay.includes(term));
}

function visibleMatches(all = allMatches()) {
    const q = state.search.trim().toLowerCase();
    const bounds = state.inView && map ? map.getBounds() : null;
    const near = state.near;
    const base = all.filter(m => {
        if (!matchesSearch(m, q)) return false;
        if (bounds && !(m.loc && bounds.contains([m.loc.lat, m.loc.lng]))) return false;
        if (near) {
            if (!m.loc) return false; // can't tell how far an unplaced match is
            m.dist = distanceKm(near, m.loc);
            if (m.dist > state.radius) return false;
        }
        return true;
    });
    const dayCounts = new Map();
    base.forEach(m => dayCounts.set(m.day, (dayCounts.get(m.day) || 0) + 1));
    if (state.day && !dayCounts.has(state.day)) state.day = null;
    const list = state.day ? base.filter(m => m.day === state.day) : base;
    if (near && state.sort === 'distance') list.sort((a, b) => a.dist - b.dist || a.kickoff - b.kickoff);
    return { list, dayCounts };
}

/* =====================================================================
 * Rendering
 * =================================================================== */

let renderQueued = false;
function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
}

function render() {
    const all = allMatches();
    refreshStarred(all);
    const { list, dayCounts } = visibleMatches(all);
    renderTabs();
    renderStatus(list.length);
    if (state.tab === 'shortlist') {
        $('days').innerHTML = '';
        const items = shortlistItems();
        renderShortlist(items);
        renderMarkers(items);
        renderRoute(items);
    } else {
        renderDays(dayCounts);
        renderList(list);
        renderMarkers(list);
        renderRoute([]);
    }
}

function renderStatus(count) {
    const total = state.enabled.size;
    const loading = state.loading.size;
    if (count != null) $('matchCount').textContent = loading && !count ? '' : String(count);
    $('progress').hidden = !loading;
    $('progress').firstElementChild.style.width = `${total ? Math.round((total - loading) / total * 100) : 0}%`;
    const bits = [];
    if (loading) bits.push(`<span>Loading ${total - loading}/${total}…</span>`);
    else if (state.geocodePending > 0) bits.push(`<span title="Looking up stadium locations"><span class="spinner"></span>${state.geocodePending} grounds</span>`);
    if (state.failed.size) {
        const names = [...state.failed.keys()].map(sl => COMP_BY_SLUG[sl].name).join(', ');
        bits.push(`<span class="err" title="Couldn't load: ${esc(names)}">${state.failed.size} failed · <button class="link-btn" data-action="retry">retry</button></span>`);
    }
    $('status').innerHTML = bits.join('');
}

function renderDays(dayCounts) {
    const el = $('days');
    if (dayCounts.size < 2 && !state.day) { el.innerHTML = ''; return; }
    const days = [...dayCounts.keys()].sort();
    el.innerHTML = `<button class="chip ${state.day ? '' : 'on'}" data-day="">All days</button>` +
        days.map(d => `<button class="chip ${state.day === d ? 'on' : ''}" data-day="${d}">${esc(formatDayLabel(d))}<span class="n">${dayCounts.get(d)}</span></button>`).join('');
}

function crest(team) {
    return team.logo
        ? `<img src="${esc(team.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'crest'}))">`
        : '<span class="crest"></span>';
}

function teamsHtml(m) {
    const post = m.state === 'post' || m.state === 'in';
    const row = (t, other) => {
        const lost = m.state === 'post' && !t.winner && other.winner;
        return `<div class="team ${lost ? 'lost' : ''}">${crest(t)}<span class="name">${esc(t.name)}</span>${post ? `<span class="score">${esc(t.score)}</span>` : ''}</div>`;
    };
    return `<div class="teams">${row(m.home, m.away)}${row(m.away, m.home)}</div>`;
}

function statusPill(m) {
    const s = m.statusName;
    if (s === 'STATUS_POSTPONED') return '<span class="pill pp">POSTPONED</span>';
    if (s === 'STATUS_CANCELED' || s === 'STATUS_CANCELLED') return '<span class="pill pp">CANCELLED</span>';
    if (s === 'STATUS_SUSPENDED' || s === 'STATUS_ABANDONED') return '<span class="pill pp">' + esc(s.replace('STATUS_', '')) + '</span>';
    if (m.state === 'in') return `<span class="pill live">LIVE ${esc(m.statusShort)}</span>`;
    if (m.state === 'post') return `<span class="pill ft">${esc(m.statusShort || 'FT')}</span>`;
    if (!m.timeValid) return '<span class="pill tbc">TIME TBC</span>';
    return '';
}

function whenHtml(m, withDay) {
    const tz = displayZone(m);
    const dayPart = withDay ? `${formatDayLabel(matchDay(m, tz))} · ` : '';
    if (!m.timeValid) return `${esc(dayPart)}TBC`;
    const main = `${dayPart}${timeInZone(m.kickoff, tz)}`;
    // When showing venue time, also hint the user's own time if it differs.
    let alt = '';
    if (state.tzMode === 'venue' && timeInZone(m.kickoff, MY_TZ) !== timeInZone(m.kickoff, tz)) {
        alt = ` <span class="alt">(${timeInZone(m.kickoff, MY_TZ)} yours)</span>`;
    }
    return `${esc(main)} <span class="alt">${esc(zoneAbbr(m.kickoff, tz))}</span>${alt}`;
}

function venueText(m) {
    const v = m.venue;
    const place = [v.city, v.country].filter(Boolean).join(', ');
    return [v.name, place].filter(Boolean).join(' · ') || 'Venue TBC';
}

function renderList(list) {
    const el = $('list');
    if (!list.length) {
        if (state.loading.size) { el.innerHTML = ''; return; }
        let msg = 'No matches in these dates for the selected competitions.';
        if (!state.enabled.size) msg = 'Pick at least one competition above.';
        else if (state.search) msg = `Nothing matches “${esc(state.search)}”.`;
        else if (state.near) msg = `No matches within ${state.radius} km of ${esc(state.near.name)}. Try a bigger distance or other dates.`;
        else if (state.inView) msg = 'No matches in the visible map area. Zoom out or untick “Only what\'s on the map”.';
        const allFailed = state.failed.size && state.failed.size === state.enabled.size;
        el.innerHTML = allFailed
            ? `<div class="banner">Couldn't reach the fixtures feed (${esc([...state.failed.values()][0])}).
                ${location.protocol === 'file:' ? 'Some browsers block requests from pages opened as local files. Try serving the folder instead, e.g. <code>python3 -m http.server</code> and open http://localhost:8000.' : 'Check your connection, or ESPN may be blocking requests right now.'}
                <br><button class="chip" data-action="retry">Try again</button></div>`
            : `<div class="empty"><strong>No games found</strong>${msg}</div>`;
        return;
    }

    let html = '';
    if (state.near && state.sort === 'distance') {
        html += `<div class="day-head"><span>Nearest to ${esc(state.near.name)}</span><span>${list.length}</span></div>`;
        html += list.map(m => cardHtml(m, { withDay: true })).join('');
    } else {
        const groups = new Map();
        list.forEach(m => { if (!groups.has(m.day)) groups.set(m.day, []); groups.get(m.day).push(m); });
        for (const [day, matches] of groups) {
            html += `<div class="day-head"><span>${esc(formatDayLabel(day))}</span><span>${matches.length}</span></div>`;
            html += matches.map(m => cardHtml(m)).join('');
        }
    }
    el.innerHTML = html;
}

function compTag(m) {
    const logo = leagueLogos[m.comp.slug];
    return `<span class="comp-tag">${logo ? `<img src="${esc(logo)}" alt="" onerror="this.remove()">` : ''}${esc(m.comp.name)}</span>`;
}

function starButton(id) {
    const on = state.starred.has(id);
    return `<button type="button" class="star ${on ? 'on' : ''}" data-star="${esc(id)}" aria-pressed="${on}" title="${on ? 'Remove from shortlist' : 'Add to shortlist'}">${on ? '★' : '☆'}</button>`;
}

function distanceHtml(m) {
    if (!state.near || m.dist == null) return '';
    const how = m.dist > FLY_KM ? ' by air' : '';
    return `<span class="dist" title="Straight-line distance; travel time is a rough estimate">${esc(distLabel(m.dist))} · ≈${esc(formatMinutes(travelMinutes(m.dist)))}${how}</span>`;
}

// One match card. `extra` lets the shortlist add change notices.
function cardHtml(m, { withDay = false, extra = '' } = {}) {
    const color = GROUPS[m.comp.group].color;
    const tbc = tbcInfo(m);
    return `<div class="card ${m.id === state.selectedId ? 'sel' : ''}" style="--c:${color}" data-id="${esc(m.id)}" role="button" tabindex="0">
        <div class="card-top">${compTag(m)}<span class="when">${statusPill(m)} ${whenHtml(m, withDay)}</span></div>
        ${teamsHtml(m)}
        ${tbc ? `<div class="tbc-note" title="${esc(tbc.long)}">⏳ ${esc(tbc.short)}</div>` : ''}
        ${extra}
        <div class="card-bottom"><span class="venue">${esc(venueText(m))}</span><span class="right">${m.loc ? distanceHtml(m) : '<span class="nomap">not on map</span>'}${starButton(m.id)}</span></div>
    </div>`;
}

function popupHtml(m) {
    const color = GROUPS[m.comp.group].color;
    const mapsUrl = m.loc
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${m.venue.name} ${m.venue.city}`.trim())}`
        : '';
    const pill = statusPill(m);
    return `<div style="--c:${color}">
        <div class="pop-head"><span>${esc(m.comp.name)}</span><span>${esc(m.venue.country)}</span></div>
        <div class="pop-body">
            ${teamsHtml(m)}
            <div class="pop-meta">
                <div>${pill ? pill + ' ' : ''}<b>${whenHtml(m, true)}</b></div>
                <div>${esc(venueText(m))}${m.neutral ? ' (neutral venue)' : ''}</div>
                ${m.loc && m.loc.precision === 'city' ? `<div style="color:var(--faint)">Pin shows the city; ${m.loc.pending ? 'still locating the ground…' : 'exact ground not found.'}</div>` : ''}
                ${state.near && m.loc ? `<div>${esc(travelLabel(distanceKm(state.near, m.loc)))} from ${esc(state.near.name)}</div>` : ''}
                ${tbcInfo(m) ? `<div class="tbc-note">${esc(tbcInfo(m).long)}</div>` : ''}
            </div>
            <div class="pop-links">
                <button type="button" class="link-btn" data-star="${esc(m.id)}">${state.starred.has(m.id) ? '★ Saved' : '☆ Save to shortlist'}</button>
                <button type="button" class="link-btn" data-ics="${esc(m.id)}">Add to calendar</button>
                ${m.link ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">Match centre ↗</a>` : ''}
                ${mapsUrl ? `<a href="${esc(mapsUrl)}" target="_blank" rel="noopener">Directions ↗</a>` : ''}
            </div>
        </div>
    </div>`;
}

// Logo badge when we know the competition's logo; the short code otherwise (or if the image fails).
function pinHtml(m, classes, color) {
    const logo = leagueLogos[m.comp.slug];
    if (!logo) return `<div class="${classes}" style="--c:${color}">${esc(m.comp.short)}</div>`;
    return `<div class="${classes} logo" style="--c:${color}" title="${esc(m.comp.name)}"><img src="${esc(logo)}" alt="${esc(m.comp.short)}" onerror="this.parentNode.classList.remove('logo');this.replaceWith(this.alt)"></div>`;
}

function renderMarkers(list) {
    if (!cluster) return;
    // Only rebuild when the set of pins actually changes, so popups don't close on every render.
    const signature = list.filter(m => m.loc).map(m => `${m.id}@${m.loc.lat},${m.loc.lng}:${m.state}:${m.home.score}-${m.away.score}:${state.tzMode}:${leagueLogos[m.comp.slug] ? 1 : 0}:${state.starred.has(m.id) ? 1 : 0}`).join('|') + `#${state.tab}`;
    if (signature === renderMarkers.last) return;
    renderMarkers.last = signature;

    const openId = [...markerById.entries()].find(([, mk]) => mk.isPopupOpen())?.[0];
    cluster.clearLayers();
    markerById.clear();

    const markers = [];
    for (const m of list) {
        if (!m.loc) continue;
        const color = GROUPS[m.comp.group].color;
        const classes = ['pin', m.state === 'in' ? 'live' : '', m.loc.precision === 'city' ? 'approx' : '', state.starred.has(m.id) ? 'starred' : ''].join(' ');
        const icon = L.divIcon({
            className: 'pin-icon',
            html: pinHtml(m, classes, color),
            iconSize: [0, 0],
        });
        const marker = L.marker([m.loc.lat, m.loc.lng], { icon, title: `${m.home.name} v ${m.away.name}` })
            .bindPopup(() => popupHtml(m), { maxWidth: 280, minWidth: 260 });
        marker.on('click', () => selectCard(m.id, false));
        markerById.set(m.id, marker);
        markers.push(marker);
    }
    cluster.addLayers(markers);
    if (openId && markerById.has(openId)) cluster.zoomToShowLayer(markerById.get(openId), () => markerById.get(openId).openPopup());
}

function renderLegend() {
    const used = new Set(COMPETITIONS.filter(c => state.enabled.has(c.slug)).map(c => c.group));
    $('legend').innerHTML = Object.entries(GROUPS).filter(([g]) => used.has(g))
        .map(([, g]) => `<div><span class="dot" style="background:${g.color}"></span>${esc(g.name)}</div>`).join('')
        + '<div style="color:var(--faint);margin-top:2px">Dashed pin = city, not exact ground</div>';
}

function renderCompPicker() {
    const groups = Object.entries(GROUPS).map(([key, g]) => {
        const chips = COMPETITIONS.filter(c => c.group === key).map(c =>
            `<button type="button" class="chip comp-chip ${state.enabled.has(c.slug) ? 'on' : ''}" style="--c:${g.color}" data-slug="${c.slug}" title="${esc(c.name)}">${esc(c.name)}</button>`).join('');
        return `<div class="comp-group"><div class="comp-group-title"><span class="dot" style="background:${g.color}"></span>${esc(g.name)}</div><div class="chips">${chips}</div></div>`;
    }).join('');
    $('compGroups').innerHTML = groups;
    $('compSummary').textContent = state.enabled.size === COMPETITIONS.length ? 'All' : String(state.enabled.size);
    $('compBtn').title = `${state.enabled.size} of ${COMPETITIONS.length} competitions shown`;
    renderLegend();
}

function renderPresets() {
    const today = isoDay(new Date());
    document.querySelectorAll('#presets .chip').forEach(btn => {
        const [s, e] = presetRange(btn.dataset.preset, today);
        btn.classList.toggle('on', s === state.start && e === state.end);
    });
}

function renderTzSeg() {
    document.querySelectorAll('#tzSeg button').forEach(b => b.classList.toggle('on', b.dataset.tz === state.tzMode));
}

/* =====================================================================
 * Interaction
 * =================================================================== */

function presetRange(preset, today) {
    if (preset === 'weekend') {
        const [y, m, d] = today.split('-').map(Number);
        const dow = new Date(y, m - 1, d).getDay(); // 0 Sun .. 6 Sat
        if (dow === 0) return [today, today];
        const fri = dow === 6 ? addDays(today, -1) : addDays(today, (5 - dow + 7) % 7);
        const start = fri < today ? today : fri;
        return [start, addDays(fri, 2)];
    }
    const n = Number(preset);
    return [today, addDays(today, n - 1)];
}

function setRange(start, end, { load = true } = {}) {
    if (!start || !end) return;
    if (end < start) end = start;
    if (dayDiff(start, end) + 1 > MAX_RANGE_DAYS) end = addDays(start, MAX_RANGE_DAYS - 1);
    state.start = start;
    state.end = end;
    renderRangeText();
    store.set('fp:range', { start, end, saved: isoDay(new Date()) });
    renderPresets();
    if (load) resetAndLoad();
}

/* ---------- Date range picker: one calendar, click start then end ---------- */

const picker = { open: false, anchor: null, hover: null, month: '' }; // month = 'YYYY-MM-01'

function renderRangeText() {
    const n = dayDiff(state.start, state.end) + 1;
    const thisYear = isoDay(new Date()).slice(0, 4);
    const parts = d => { const [y, m, dd] = d.split('-').map(Number); return { y, dd, mon: new Date(y, m - 1, dd).toLocaleDateString('en-GB', { month: 'short' }) }; };
    const a = parts(state.start), b = parts(state.end);
    const year = String(b.y) !== thisYear ? ` ${b.y}` : '';
    let text;
    if (state.start === state.end) text = `${a.dd} ${a.mon}${year}`;
    else if (a.mon === b.mon && a.y === b.y) text = `${a.dd}–${b.dd} ${b.mon}${year}`;
    else text = `${a.dd} ${a.mon}${a.y !== b.y ? ' ' + a.y : ''} – ${b.dd} ${b.mon}${year}`;
    $('rangeText').innerHTML = `${esc(text)} <span class="n">${n} day${n > 1 ? 's' : ''}</span>`;
}

function renderCalendar() {
    const [y, m] = picker.month.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    $('calTitle').textContent = first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

    // While choosing the end date, preview the range under the pointer.
    let lo = state.start, hi = state.end;
    if (picker.anchor) {
        lo = picker.anchor;
        hi = picker.hover && picker.hover >= picker.anchor ? picker.hover : picker.anchor;
    }
    const maxEnd = picker.anchor ? addDays(picker.anchor, MAX_RANGE_DAYS - 1) : null;
    const today = isoDay(new Date());

    const lead = (first.getDay() + 6) % 7; // weeks start on Monday
    const daysInMonth = new Date(y, m, 0).getDate();
    let html = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => `<span class="cal-dow">${d}</span>`).join('');
    html += '<span></span>'.repeat(lead);
    for (let d = 1; d <= daysInMonth; d++) {
        const day = isoDay(new Date(y, m - 1, d));
        const cls = ['cal-day'];
        if (day >= lo && day <= hi) cls.push('in');
        if (day === lo) cls.push('start');
        if (day === hi) cls.push('end');
        if (day === today) cls.push('today');
        const disabled = maxEnd && day > maxEnd;
        html += `<button type="button" class="${cls.join(' ')}" data-pick="${day}" ${disabled ? 'disabled' : ''} aria-label="${esc(formatDayLabel(day))}">${d}</button>`;
    }
    $('calGrid').innerHTML = html;
    $('calHint').textContent = picker.anchor
        ? `Now pick an end date (up to ${MAX_RANGE_DAYS} days)`
        : 'Pick a start date';
}

function openPicker() {
    picker.open = true;
    picker.anchor = null;
    picker.hover = null;
    picker.month = state.start.slice(0, 8) + '01';
    $('calPop').hidden = false;
    $('rangeBtn').setAttribute('aria-expanded', 'true');
    renderCalendar();
}

function closePicker() {
    picker.open = false;
    picker.anchor = null; // an unfinished selection is discarded
    $('calPop').hidden = true;
    $('rangeBtn').setAttribute('aria-expanded', 'false');
}

function initRangePicker() {
    $('rangeBtn').addEventListener('click', () => (picker.open ? closePicker() : openPicker()));
    $('calPop').addEventListener('click', e => {
        const nav = e.target.closest('[data-nav]');
        if (nav) {
            const [y, m] = picker.month.split('-').map(Number);
            picker.month = isoDay(new Date(y, m - 1 + Number(nav.dataset.nav), 1));
            return renderCalendar();
        }
        const btn = e.target.closest('[data-pick]');
        if (!btn) return;
        const day = btn.dataset.pick;
        if (!picker.anchor || day < picker.anchor) {
            picker.anchor = day; // first click (or an earlier day) starts the range
            renderCalendar();
            return;
        }
        const start = picker.anchor;
        closePicker();
        setRange(start, day);
    });
    $('calGrid').addEventListener('mouseover', e => {
        const btn = e.target.closest('[data-pick]');
        if (!picker.anchor || !btn || btn.dataset.pick === picker.hover) return;
        picker.hover = btn.dataset.pick;
        renderCalendar();
    });
    document.addEventListener('mousedown', e => {
        if (picker.open && !e.target.closest('.range')) closePicker();
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && picker.open) { closePicker(); $('rangeBtn').focus(); }
    });
}

/* ---------- Unconfirmed kick-off times ---------- */

// Rough lead times for when each league fixes TV-driven kick-offs. Guidance only, not a promise.
const TBC_RULES = {
    'eng.1': { weeks: 5, text: 'about 5–6 weeks before', tv: true },
    'eng.2': { weeks: 4, text: 'about 4 weeks before', tv: true },
    'esp.1': { weeks: 2, text: 'only about 1–3 weeks before', tv: true },
    'ita.1': { weeks: 3, text: 'about 3–4 weeks before', tv: true },
    'ger.1': { weeks: 4, text: 'about 3–5 weeks before', tv: true },
    'fra.1': { weeks: 3, text: 'about 3–4 weeks before', tv: true },
};
const CUP_SLUG = /\.(fa|league_cup|copa_del_rey|coppa_italia|dfb_pokal|coupe_de_france)$/;

function tbcRule(comp) {
    if (TBC_RULES[comp.slug]) return TBC_RULES[comp.slug];
    if (comp.group === 'uefa') return { weeks: 4, text: 'when UEFA publishes the schedule, usually well ahead', tv: false };
    if (CUP_SLUG.test(comp.slug)) return { weeks: 2, text: 'about 2–3 weeks after the draw', tv: true };
    return { weeks: 3, text: 'about 2–4 weeks before', tv: true };
}

function tbcInfo(m) {
    if (m.timeValid || m.state !== 'pre' || m.statusName === 'STATUS_POSTPONED') return null;
    const rule = tbcRule(m.comp);
    const day = matchDay(m, m.tz);
    const expected = addDays(day, -7 * rule.weeks);
    const due = expected <= isoDay(new Date());
    return {
        short: due ? 'Kick-off time due to be announced any day' : `Kick-off time usually confirmed around ${formatDayLabel(expected)}`,
        long: `Kick-off time not confirmed yet. ${m.comp.name} times are usually set ${rule.text}, so ${due ? 'it should be announced any day now' : `expect it around ${formatDayLabel(expected)}`}.`
            + (rule.tv ? ' The match can also move to another day of that weekend for TV.' : '')
            + ' Avoid non-refundable bookings that depend on the exact time.',
    };
}

/* ---------- Distances ---------- */

function distLabel(km) { return km < 10 ? `${km.toFixed(1)} km` : `${Math.round(km)} km`; }

// Beyond this, assume you'd fly: ~3h of airports and transfers plus flight time.
const FLY_KM = 600;
function travelMinutes(km) {
    return km > FLY_KM ? Math.round((180 + km / 750 * 60) / 15) * 15 : driveMinutes(km);
}
function travelLabel(km) {
    if (km < 1) return 'Same stadium';
    return km > FLY_KM
        ? `${distLabel(km)} · ≈${formatMinutes(travelMinutes(km))} door to door by air`
        : `${distLabel(km)} · ≈${formatMinutes(driveMinutes(km))} drive`;
}

// Straight line × 1.3 for roads, at a speed that grows with distance. A rough guide only.
function driveMinutes(km) {
    const road = km * 1.3;
    const speed = road < 40 ? 40 : road < 150 ? 70 : 90;
    return Math.max(5, Math.round((road / speed) * 60 / 5) * 5);
}
function formatMinutes(mins) {
    if (mins < 60) return `${mins} min`;
    const h = Math.floor(mins / 60), r = mins % 60;
    return r ? `${h}h ${r}m` : `${h}h`;
}

/* ---------- Shortlist ---------- */

// Starred matches are stored as snapshots so the shortlist survives changing dates or reloading.
function snapshot(m, prev) {
    const kickoff = m.kickoff.toISOString();
    const side = t => ({ name: t.name, short: t.short, logo: t.logo, score: t.score, winner: t.winner });
    return {
        id: m.id, slug: m.comp.slug, kickoff, timeValid: m.timeValid,
        state: m.state, statusName: m.statusName, statusShort: m.statusShort,
        home: side(m.home), away: side(m.away), neutral: m.neutral,
        venue: m.venue, loc: m.loc ? { lat: m.loc.lat, lng: m.loc.lng, precision: m.loc.precision } : null,
        tz: m.tz, link: m.link,
        // What the kick-off was when you saved it, so later changes can be flagged.
        savedKickoff: prev ? prev.savedKickoff : kickoff,
        savedTimeValid: prev ? prev.savedTimeValid : m.timeValid,
    };
}

function fromSnapshot(s) {
    const m = { ...s, comp: COMP_BY_SLUG[s.slug], kickoff: new Date(s.kickoff) };
    if (!m.loc) m.loc = locationFor(m.venue); // the ground may have been found since
    m.day = matchDay(m, displayZone(m));
    m.inRange = !!state.raw.get(s.slug) && m.day >= state.start && m.day <= state.end;
    return m;
}

function saveStarred() { store.set('fp:starred', [...state.starred.values()]); }

// Keep saved matches up to date with fresh data, and resolve stars from shared links.
function refreshStarred(all) {
    let changed = false;
    for (const m of all) {
        const prev = state.starred.get(m.id);
        if (!prev && !state.pendingStars.has(m.id)) continue;
        state.pendingStars.delete(m.id);
        const next = snapshot(m, prev);
        if (!prev || JSON.stringify(next) !== JSON.stringify(prev)) { state.starred.set(m.id, next); changed = true; }
    }
    if (changed) saveStarred();
}

function toggleStar(id) {
    if (state.starred.has(id)) {
        state.starred.delete(id);
    } else {
        const m = allMatches().find(x => x.id === id);
        if (!m) return;
        state.starred.set(id, snapshot(m, null));
    }
    saveStarred();
    render();
}

function shortlistItems() {
    return [...state.starred.values()].filter(s => COMP_BY_SLUG[s.slug]).map(fromSnapshot).sort((a, b) => a.kickoff - b.kickoff);
}

function fmtKickoff(iso, timeValid, tz) {
    const d = new Date(iso);
    const day = formatDayLabel(timeValid ? dayInZone(d, tz) : iso.slice(0, 10));
    return timeValid ? `${day} ${timeInZone(d, tz)}` : `${day} (time TBC)`;
}

function changeNote(m) {
    let text = '';
    if (m.savedTimeValid && m.timeValid && m.savedKickoff !== m.kickoff.toISOString()) {
        text = `Kick-off changed since you saved it (was ${fmtKickoff(m.savedKickoff, true, displayZone(m))}).`;
    } else if (!m.savedTimeValid && m.timeValid) {
        text = 'Kick-off time confirmed since you saved it.';
    }
    return text ? `<div class="changed">⚠ ${esc(text)} <button type="button" class="link-btn" data-ack="${esc(m.id)}">OK</button></div>` : '';
}

// Travel between two consecutive saved matches, with a warning when you can't make both.
function legHtml(prev, cur) {
    if (!prev.loc || !cur.loc) return '';
    const km = distanceKm(prev.loc, cur.loc);
    const mins = km < 1 ? 0 : travelMinutes(km);
    const travel = travelLabel(km);
    if (!prev.timeValid || !cur.timeValid) return `<div class="leg">${esc(travel)} · times not confirmed yet</div>`;
    const gap = (cur.kickoff - prev.kickoff) / 60000;
    if (gap < 5) return `<div class="leg warn">⚠ Same kick-off time: you can only see one of these</div>`;
    if (gap < 120) return `<div class="leg warn">⚠ Kick-offs overlap: only ${esc(formatMinutes(Math.round(gap)))} apart</div>`;
    const spare = gap - 120 - mins; // ~2h for the first match itself
    if (spare < 0) return `<div class="leg warn">⚠ Can't make both: ${esc(travel)}, but only ${esc(formatMinutes(Math.max(0, Math.round(gap - 120))))} after the first final whistle</div>`;
    if (spare < 60 && km >= 1) return `<div class="leg warn">⚠ Tight: ${esc(travel)} with under an hour to spare</div>`;
    return `<div class="leg">${esc(travel)}</div>`;
}

function renderShortlist(items) {
    const el = $('list');
    if (!items.length) {
        el.innerHTML = `<div class="empty"><strong>Your shortlist is empty</strong>Tap ☆ on any match to save it here. You'll get an itinerary with travel times, clash warnings and a calendar export.</div>`
            + (state.pendingStars.size ? `<div class="banner">${state.pendingStars.size} shared match${state.pendingStars.size > 1 ? 'es' : ''} still loading…</div>` : '');
        return;
    }
    let html = `<div class="sl-actions">
        <button type="button" class="chip" data-action="ics-all">📅 Add all to calendar</button>
        <button type="button" class="chip" data-action="share">🔗 Copy share link</button>
        <button type="button" class="chip" data-action="clear-stars">Clear</button>
    </div>`;
    let prev = null, lastDay = null;
    for (const m of items) {
        if (prev) html += legHtml(prev, m); // travel sits between the two matches, before any new day heading
        if (m.day !== lastDay) {
            html += `<div class="day-head"><span>${esc(formatDayLabel(m.day))}</span><span></span></div>`;
            lastDay = m.day;
        }
        if (state.near && m.loc) m.dist = distanceKm(state.near, m.loc);
        const stale = m.inRange ? '' : '<div class="stale">Outside your current dates. Details are from when it was last loaded.</div>';
        html += cardHtml(m, { extra: changeNote(m) + stale });
        prev = m;
    }
    el.innerHTML = html;
}

function renderRoute(items) {
    if (!routeLayer) return;
    routeLayer.clearLayers();
    const pts = items.filter(m => m.loc).map(m => [m.loc.lat, m.loc.lng]);
    if (pts.length > 1) L.polyline(pts, { color: '#facc15', weight: 2.5, opacity: .8, dashArray: '6 8' }).addTo(routeLayer);
}

function renderTabs() {
    document.body.dataset.tab = state.tab;
    document.querySelectorAll('#tabs [data-tab]').forEach(b => {
        b.classList.toggle('on', b.dataset.tab === state.tab);
        b.setAttribute('aria-selected', String(b.dataset.tab === state.tab));
    });
    $('starCount').textContent = state.starred.size ? String(state.starred.size) : '';
    $('sortWrap').hidden = !state.near || state.tab === 'shortlist';
    document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.sort === state.sort));
}

function setTab(tab) {
    state.tab = tab;
    render();
    if (tab === 'shortlist') fitToMatches();
}

/* ---------- Calendar export (.ics) ---------- */

function icsText(text) { return String(text || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function icsStamp(date) { return date.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function icsFold(line) {
    const out = [];
    while (line.length > 74) { out.push(line.slice(0, 74)); line = ' ' + line.slice(74); }
    out.push(line);
    return out.join('\r\n');
}

function buildIcs(matches) {
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//footyplanner//EN', 'CALSCALE:GREGORIAN'];
    for (const m of matches) {
        const title = `${m.home.name} v ${m.away.name} (${m.comp.name})${m.timeValid ? '' : ' (time TBC)'}`;
        const desc = [
            m.timeValid ? '' : 'Kick-off time not confirmed yet; check before you travel.',
            m.link ? `Match centre: ${m.link}` : '',
            'Added from FootyPlanner',
        ].filter(Boolean).join('\n');
        lines.push('BEGIN:VEVENT', `UID:${m.id.replace(/[^\w.-]/g, '-')}@footyplanner`, `DTSTAMP:${icsStamp(new Date())}`);
        if (m.timeValid) {
            lines.push(`DTSTART:${icsStamp(m.kickoff)}`, `DTEND:${icsStamp(new Date(m.kickoff.getTime() + 2 * 3600e3))}`);
        } else {
            const day = matchDay(m, m.tz);
            lines.push(`DTSTART;VALUE=DATE:${day.replaceAll('-', '')}`, `DTEND;VALUE=DATE:${addDays(day, 1).replaceAll('-', '')}`);
        }
        lines.push(`SUMMARY:${icsText(title)}`, `LOCATION:${icsText(venueText(m).replace(' · ', ', '))}`, `DESCRIPTION:${icsText(desc)}`);
        if (m.loc) lines.push(`GEO:${m.loc.lat.toFixed(5)};${m.loc.lng.toFixed(5)}`);
        lines.push('END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return lines.map(icsFold).join('\r\n') + '\r\n';
}

function downloadIcs(matches, filename) {
    if (!matches.length) return;
    const url = URL.createObjectURL(new Blob([buildIcs(matches)], { type: 'text/calendar' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function matchById(id) {
    return allMatches().find(m => m.id === id) || (state.starred.has(id) ? fromSnapshot(state.starred.get(id)) : null);
}

/* ---------- Share links ---------- */

function shareUrl() {
    const params = new URLSearchParams();
    params.set('d', `${state.start}_${state.end}`);
    params.set('c', [...state.enabled].join(','));
    if (state.near) params.set('n', `${state.near.lat.toFixed(4)},${state.near.lng.toFixed(4)},${state.radius},${state.near.name}`);
    if (state.starred.size) params.set('s', [...state.starred.keys()].join(','));
    return `${location.href.split('#')[0]}#${params}`;
}

async function copyShareLink() {
    const url = shareUrl();
    try {
        await navigator.clipboard.writeText(url);
        toast(location.protocol === 'file:' ? 'Link copied. It will only open for others once the site is deployed.' : 'Share link copied');
    } catch {
        window.prompt('Copy this link:', url);
    }
}

// Reads a shared link (#d=…&c=…&n=…&s=…) into state, then clears it from the address bar.
function applyShareHash() {
    if (!location.hash.includes('=')) return null;
    // Where the hash can't be cleared (file://), don't re-apply the same link on every reload.
    // Remembered for an hour, so opening the link again later still works.
    const applied = store.get('fp:appliedHash', null);
    if (applied && applied.hash === location.hash && Date.now() - applied.t < 3600e3) return null;
    store.set('fp:appliedHash', { hash: location.hash, t: Date.now() });
    const p = new URLSearchParams(location.hash.slice(1));
    const range = (p.get('d') || '').split('_');
    const comps = (p.get('c') || '').split(',').filter(sl => COMP_BY_SLUG[sl]);
    if (comps.length) { state.enabled = new Set(comps); store.set('fp:comps', comps); }
    const n = (p.get('n') || '').split(',');
    if (n.length >= 4 && !isNaN(+n[0]) && !isNaN(+n[1])) {
        state.near = { lat: +n[0], lng: +n[1], name: n.slice(3).join(',') };
        state.radius = +n[2] || 100;
        store.set('fp:near', state.near);
        store.set('fp:radius', state.radius);
    }
    const stars = (p.get('s') || '').split(',').filter(Boolean).filter(id => !state.starred.has(id));
    stars.forEach(id => state.pendingStars.add(id));
    if (stars.length || p.get('s')) state.tab = 'shortlist';
    try { history.replaceState(null, '', location.href.split('#')[0]); } catch { /* some browsers refuse on file:// */ }
    return /^\d{4}-\d{2}-\d{2}$/.test(range[0]) && /^\d{4}-\d{2}-\d{2}$/.test(range[1]) ? range : null;
}

let toastTimer;
function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}

/* ---------- Near a place ---------- */

function setNear(place, { fit = true } = {}) {
    state.near = place;
    store.set('fp:near', place);
    if (!place) { state.sort = 'time'; store.set('fp:sort', 'time'); }
    renderNearControls();
    renderNear(fit);
    render();
}

function renderNear(fit) {
    if (!nearLayer) return;
    nearLayer.clearLayers();
    const near = state.near;
    if (!near) return;
    const circle = L.circle([near.lat, near.lng], {
        radius: state.radius * 1000, color: '#10b981', weight: 1.5, dashArray: '6 6', fillOpacity: .05, interactive: false,
    }).addTo(nearLayer);
    L.marker([near.lat, near.lng], {
        icon: L.divIcon({ className: 'pin-icon', html: '<div class="home-pin" title="Your place">⌂</div>', iconSize: [0, 0] }),
        title: near.name, keyboard: false, zIndexOffset: 1000,
    }).addTo(nearLayer);
    if (fit) map.fitBounds(circle.getBounds(), { padding: [20, 20] });
}

function placeLabel(props) {
    const name = props.name || [props.street, props.housenumber].filter(Boolean).join(' ') || props.city || '';
    const sub = [props.city !== name ? props.city : '', props.state, props.country].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(', ');
    return { name, sub };
}

function renderNearControls() {
    const near = state.near;
    $('nearText').textContent = near ? `${near.name} · ${state.radius} km` : 'Anywhere';
    $('nearBtn').classList.toggle('set', !!near);
    $('nearInput').value = near ? near.name : '';
    $('nearClear').hidden = !near;
    document.querySelectorAll('#nearRadius [data-radius]').forEach(b => b.classList.toggle('on', +b.dataset.radius === state.radius));
}

function initNear() {
    const input = $('nearInput'), box = $('nearSuggest');
    let results = [], active = -1, timer, seq = 0;
    renderNearControls();

    const close = () => { box.hidden = true; active = -1; };
    const show = html => { box.innerHTML = html; box.hidden = false; };
    const draw = () => show(results.length
        ? results.map((r, i) => `<button type="button" role="option" class="${i === active ? 'active' : ''}" data-i="${i}">${esc(r.name)}<small>${esc(r.sub)}</small></button>`).join('')
        : '<div class="msg">No places found</div>');
    const choose = i => {
        const r = results[i];
        if (!r) return;
        close();
        setPopover('near', false);
        setNear({ name: r.name, lat: r.lat, lng: r.lng });
    };

    input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 2) { close(); return; }
        timer = setTimeout(async () => {
            const mine = ++seq;
            const c = map.getCenter();
            try {
                const feats = await photon({ q, limit: '6', lat: c.lat.toFixed(3), lon: c.lng.toFixed(3) });
                if (mine !== seq) return;
                results = feats.map(f => ({ ...placeLabel(f.properties || {}), ...featPoint(f) })).filter(r => r.name);
                active = -1;
                draw();
            } catch {
                if (mine === seq) show('<div class="msg">Place search is unavailable right now</div>');
            }
        }, 250);
    });
    input.addEventListener('keydown', e => {
        if (box.hidden || !results.length) return;
        if (e.key === 'ArrowDown') { active = (active + 1) % results.length; draw(); e.preventDefault(); }
        else if (e.key === 'ArrowUp') { active = (active - 1 + results.length) % results.length; draw(); e.preventDefault(); }
        else if (e.key === 'Enter') { choose(active < 0 ? 0 : active); e.preventDefault(); }
        else if (e.key === 'Escape') close();
    });
    box.addEventListener('mousedown', e => {
        const b = e.target.closest('[data-i]');
        if (b) { e.preventDefault(); choose(+b.dataset.i); }
    });
    input.addEventListener('blur', () => setTimeout(close, 150));

    $('nearClear').addEventListener('click', () => { setNear(null); input.focus(); });
    $('nearRadius').addEventListener('click', e => {
        const b = e.target.closest('[data-radius]');
        if (!b) return;
        state.radius = +b.dataset.radius;
        store.set('fp:radius', state.radius);
        renderNearControls();
        renderNear(true);
        render();
    });
    $('nearMe').addEventListener('click', () => {
        if (!navigator.geolocation) return toast('Your browser can’t share its location');
        $('nearMe').classList.add('busy');
        navigator.geolocation.getCurrentPosition(
            pos => {
                $('nearMe').classList.remove('busy');
                setPopover('near', false);
                setNear({ name: 'My location', lat: pos.coords.latitude, lng: pos.coords.longitude });
            },
            err => {
                $('nearMe').classList.remove('busy');
                toast(err.code === 1 ? 'Location permission was denied' : 'Couldn’t get your location');
            },
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 },
        );
    });
    $('sortSeg').addEventListener('click', e => {
        const b = e.target.closest('[data-sort]');
        if (!b) return;
        state.sort = b.dataset.sort;
        store.set('fp:sort', state.sort);
        render();
    });
}

/* ---------- Simple popovers (place, view options) ---------- */

const POPOVERS = { near: ['nearBtn', 'nearPop'], opt: ['optBtn', 'optPop'] };

function setPopover(name, open) {
    const [btnId, popId] = POPOVERS[name];
    $(popId).hidden = !open;
    $(btnId).setAttribute('aria-expanded', String(open));
    if (open && name === 'near') setTimeout(() => $('nearInput').focus(), 0);
}

function initPopovers() {
    for (const [name, [btnId, popId]] of Object.entries(POPOVERS)) {
        $(btnId).addEventListener('click', () => setPopover(name, $(popId).hidden));
        document.addEventListener('mousedown', e => {
            if (!$(popId).hidden && !e.target.closest(`#${popId}`) && !e.target.closest(`#${btnId}`)) setPopover(name, false);
        });
    }
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        for (const [name, [btnId, popId]] of Object.entries(POPOVERS)) {
            if (!$(popId).hidden && $('nearSuggest').hidden) { setPopover(name, false); $(btnId).focus(); }
        }
    });
}

/* ---------- Competitions dropdown ---------- */

function setCompMenu(open) {
    $('compPop').hidden = !open;
    $('compBtn').setAttribute('aria-expanded', String(open));
}

function initCompMenu() {
    $('compBtn').addEventListener('click', () => setCompMenu($('compPop').hidden));
    document.addEventListener('mousedown', e => {
        if (!$('compPop').hidden && !e.target.closest('.comp-menu')) setCompMenu(false);
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !$('compPop').hidden) { setCompMenu(false); $('compBtn').focus(); }
    });
}

/* ---------- Resizable sidebar ---------- */

const SIDEBAR_DEFAULT = 400;
const SIDEBAR_MIN = 300;
const sidebarMax = () => Math.max(SIDEBAR_MIN, Math.min(760, window.innerWidth - 320)); // always leave some map

function sidebarWidth() {
    return document.querySelector('.sidebar').getBoundingClientRect().width;
}

function setSidebarWidth(px, save) {
    const w = Math.round(Math.min(sidebarMax(), Math.max(SIDEBAR_MIN, px)));
    document.documentElement.style.setProperty('--sidebar', `${w}px`);
    $('resizer').setAttribute('aria-valuenow', String(w));
    if (save) store.set('fp:sidebar', w);
    if (map) map.invalidateSize({ pan: false });
}

function initResizer() {
    const handle = $('resizer');
    handle.setAttribute('aria-valuemin', String(SIDEBAR_MIN));
    handle.setAttribute('aria-valuemax', String(sidebarMax()));
    setSidebarWidth(store.get('fp:sidebar', SIDEBAR_DEFAULT), false);

    handle.addEventListener('pointerdown', down => {
        down.preventDefault();
        handle.setPointerCapture(down.pointerId);
        document.body.classList.add('resizing');
        const left = document.querySelector('.sidebar').getBoundingClientRect().left;
        let frame = 0;
        const move = e => {
            cancelAnimationFrame(frame);
            frame = requestAnimationFrame(() => setSidebarWidth(e.clientX - left, false));
        };
        const up = () => {
            cancelAnimationFrame(frame);
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', up);
            handle.removeEventListener('pointercancel', up);
            document.body.classList.remove('resizing');
            setSidebarWidth(sidebarWidth(), true);
        };
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', up);
        handle.addEventListener('pointercancel', up);
    });
    handle.addEventListener('dblclick', () => setSidebarWidth(SIDEBAR_DEFAULT, true));
    handle.addEventListener('keydown', e => {
        const step = e.shiftKey ? 60 : 20;
        if (e.key === 'ArrowLeft') setSidebarWidth(sidebarWidth() - step, true);
        else if (e.key === 'ArrowRight') setSidebarWidth(sidebarWidth() + step, true);
        else return;
        e.preventDefault();
    });
    window.addEventListener('resize', () => {
        handle.setAttribute('aria-valuemax', String(sidebarMax()));
        if (sidebarWidth() > sidebarMax()) setSidebarWidth(sidebarMax(), false);
    });
}

function selectCard(id, fromList) {
    state.selectedId = id;
    document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel'));
    const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if (card) {
        card.classList.add('sel');
        if (!fromList) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
}

function focusMatch(id) {
    selectCard(id, true);
    const marker = markerById.get(id);
    if (!marker) return;
    if (window.matchMedia('(max-width: 800px)').matches) setView('map');
    cluster.zoomToShowLayer(marker, () => {
        if (map.getZoom() < 11) map.setView(marker.getLatLng(), 11);
        marker.openPopup();
    });
}

function setView(view) {
    document.body.dataset.view = view;
    document.querySelectorAll('.view-switch button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
    if (view !== 'map') return;
    setTimeout(() => {
        map.invalidateSize();
        // The map was sized while hidden on phones, so frame the matches the first time it's shown.
        if (!setView.framed) { setView.framed = true; fitToMatches(); }
    }, 0);
}

function fitToMatches() {
    const items = state.tab === 'shortlist' ? shortlistItems() : visibleMatches().list;
    const pts = items.filter(m => m.loc).map(m => [m.loc.lat, m.loc.lng]);
    if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 11 });
}

function setTiles(key) {
    const t = TILES[key];
    if (tileLayer) map.removeLayer(tileLayer);
    // Base and label layers go in one group so they swap together; labels sit above the base.
    tileLayer = L.layerGroup([
        L.tileLayer(t.url, t.options),
        ...(t.labels ? [L.tileLayer(t.labels, { ...t.options, attribution: '' })] : []),
    ]).addTo(map);
}

function initMap() {
    map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView([49, 8], 5);
    L.control.zoom({ position: 'topright' }).addTo(map);
    const tileKey = TILES[store.get('fp:tiles', 'dark')] ? store.get('fp:tiles', 'dark') : 'dark';
    $('tileSelect').value = tileKey;
    setTiles(tileKey);

    cluster = L.markerClusterGroup({
        maxClusterRadius: 45,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        spiderfyDistanceMultiplier: 1.6,
        iconCreateFunction: c => L.divIcon({ className: 'cluster', html: `<div>${c.getChildCount()}</div>`, iconSize: [40, 40] }),
    }).addTo(map);
    nearLayer = L.layerGroup().addTo(map);
    routeLayer = L.layerGroup().addTo(map);

    // Buttons inside popups (save, calendar).
    map.getContainer().addEventListener('click', e => {
        const star = e.target.closest('[data-star]');
        if (star) return toggleStar(star.dataset.star);
        const ics = e.target.closest('[data-ics]');
        if (ics) {
            const m = matchById(ics.dataset.ics);
            if (m) downloadIcs([m], `${m.home.name} v ${m.away.name}.ics`.replace(/[^\w .-]/g, ''));
        }
    });

    $('tileSelect').addEventListener('change', e => {
        setTiles(e.target.value);
        store.set('fp:tiles', e.target.value);
    });
    map.on('moveend', () => { if (state.inView) scheduleRender(); });
    window.addEventListener('resize', () => map.invalidateSize());
}

function initControls() {
    initRangePicker();
    initCompMenu();
    initPopovers();
    $('presets').addEventListener('click', e => {
        const btn = e.target.closest('[data-preset]');
        if (!btn) return;
        const [s, en] = presetRange(btn.dataset.preset, isoDay(new Date()));
        closePicker();
        setRange(s, en);
    });

    $('compGroups').addEventListener('click', e => {
        const btn = e.target.closest('[data-slug]');
        if (!btn) return;
        const slug = btn.dataset.slug;
        if (state.enabled.has(slug)) state.enabled.delete(slug); else state.enabled.add(slug);
        store.set('fp:comps', [...state.enabled]);
        renderCompPicker();
        loadFixtures(); // fetches only newly enabled competitions
    });
    const setComps = slugs => {
        state.enabled = new Set(slugs);
        store.set('fp:comps', [...state.enabled]);
        renderCompPicker();
        loadFixtures();
    };
    $('compAll').addEventListener('click', e => { e.preventDefault(); setComps(COMPETITIONS.map(c => c.slug)); });
    $('compBig').addEventListener('click', e => { e.preventDefault(); setComps(COMPETITIONS.filter(c => c.big).map(c => c.slug)); });

    let searchTimer;
    $('search').addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { state.search = e.target.value; render(); }, 120);
    });

    $('inView').checked = state.inView;
    $('inView').addEventListener('change', e => { state.inView = e.target.checked; store.set('fp:inView', state.inView); render(); });

    $('tzSeg').addEventListener('click', e => {
        const btn = e.target.closest('[data-tz]');
        if (!btn) return;
        state.tzMode = btn.dataset.tz;
        store.set('fp:tz', state.tzMode);
        renderTzSeg();
        render();
    });

    $('days').addEventListener('click', e => {
        const btn = e.target.closest('[data-day]');
        if (!btn) return;
        state.day = btn.dataset.day || null;
        render();
    });

    $('list').addEventListener('click', e => {
        const action = e.target.closest('[data-action]');
        if (action) {
            const a = action.dataset.action;
            if (a === 'retry') return retryFailed();
            if (a === 'ics-all') return downloadIcs(shortlistItems(), 'footy-trip.ics');
            if (a === 'share') return copyShareLink();
            if (a === 'clear-stars' && confirm('Remove all matches from your shortlist?')) {
                state.starred.clear();
                saveStarred();
                return render();
            }
            return;
        }
        const star = e.target.closest('[data-star]');
        if (star) return toggleStar(star.dataset.star);
        const ack = e.target.closest('[data-ack]');
        if (ack) {
            const sObj = state.starred.get(ack.dataset.ack);
            if (sObj) { sObj.savedKickoff = sObj.kickoff; sObj.savedTimeValid = sObj.timeValid; saveStarred(); render(); }
            return;
        }
        const card = e.target.closest('.card');
        if (card) focusMatch(card.dataset.id);
    });
    $('list').addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) {
            e.preventDefault();
            focusMatch(e.target.dataset.id);
        }
    });
    $('tabs').addEventListener('click', e => {
        const b = e.target.closest('[data-tab]');
        if (b) setTab(b.dataset.tab);
    });
    initNear();
    $('status').addEventListener('click', e => { if (e.target.closest('[data-action="retry"]')) retryFailed(); });
    $('fitBtn').addEventListener('click', fitToMatches);
    document.querySelector('.view-switch').addEventListener('click', e => {
        const btn = e.target.closest('[data-view]');
        if (btn) setView(btn.dataset.view);
    });
}

function init() {
    if (typeof L === 'undefined' || !L.markerClusterGroup) {
        $('list').innerHTML = '<div class="banner">The map library failed to load. Check your connection and reload.</div>';
        return;
    }
    pruneFixtureCache();
    initMap();
    initResizer();
    initControls();
    renderCompPicker();
    renderTzSeg();

    // A shared link wins; otherwise restore the last range if it's still current, else the next 14 days.
    const shared = applyShareHash();
    renderCompPicker();
    renderNearControls();
    const today = isoDay(new Date());
    const saved = store.get('fp:range', null);
    if (shared) setRange(shared[0], shared[1], { load: false });
    else if (saved && saved.end >= today) setRange(saved.start < today ? today : saved.start, saved.end, { load: false });
    else setRange(...presetRange('14', today), { load: false });
    renderNear(!!state.near);
    loadFixtures();
}

init();
</script>
