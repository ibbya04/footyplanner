<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">footyplanner architecture</title>
  <desc id="desc">Browsers and calendar apps reach one Cloudflare Worker through the footyplanner.co.uk zone, where edge rules and the edge cache sit in front of it. The Worker serves the React build, a Hono API and a cron handler that reads ESPN and Photon into D1 and R2. The browser calls Photon and Esri directly.</desc>
  <style>
    :root { --bg: #f8fafc; --fg: #172033; --muted: #5b6475; --line: #64748b; --neutral: #e2e8f0; --input: #bfdbfe; --process: #c7d2fe; --storage: #99f6e4; --external: #fde68a; --risk: #fecaca; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --fg: #e5e7eb; --muted: #a3adbd; --line: #94a3b8; --neutral: #334155; --input: #1d4ed8; --process: #4338ca; --storage: #0f766e; --external: #92400e; --risk: #991b1b; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bg { fill: var(--bg); }
    .title { font-size: 20px; font-weight: 650; fill: var(--fg); }
    .label { font-size: 15px; font-weight: 600; fill: var(--fg); }
    .small { font-size: 12px; fill: var(--muted); }
    .zone-label { font-size: 13px; font-weight: 600; fill: var(--muted); letter-spacing: 0.04em; }
    .node { stroke: var(--line); stroke-width: 1; }
    .neutral { fill: var(--neutral); }
    .input { fill: var(--input); }
    .process { fill: var(--process); }
    .storage { fill: var(--storage); }
    .external { fill: var(--external); }
    .risk { fill: var(--risk); }
    .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .direct { stroke-dasharray: 5 4; }
    .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
    .arrowhead { fill: var(--line); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <rect class="bg" width="1180" height="720" />
  <text class="title" x="40" y="40">footyplanner architecture</text>

  <rect class="zone" x="270" y="90" width="630" height="560" rx="12" />
  <text class="zone-label" x="290" y="118">CLOUDFLARE · footyplanner.co.uk</text>
  <rect class="zone" x="540" y="130" width="330" height="330" rx="10" />
  <text class="zone-label" x="560" y="152">CLOUDFLARE WORKER</text>

  <path class="edge direct" d="M130 170 V66 H1125 V200" marker-end="url(#arrow)" />
  <path class="edge direct" d="M1020 66 V110" marker-end="url(#arrow)" />
  <text class="small" x="560" y="58">the browser calls these directly</text>
  <text class="small" x="1032" y="94">map tiles</text>
  <text class="small" x="1118" y="188" text-anchor="end">place search</text>

  <path class="edge" d="M220 200 H300" marker-end="url(#arrow)" />
  <text class="small" x="236" y="192">HTTPS</text>
  <path class="edge" d="M220 365 C262 365 258 228 300 228" marker-end="url(#arrow)" />

  <path class="edge" d="M500 178 C535 178 535 192 570 192" marker-end="url(#arrow)" />
  <path class="edge" d="M400 246 V300" marker-end="url(#arrow)" />
  <text class="small" x="410" y="278">/api · /img · /t</text>
  <path class="edge" d="M500 340 C535 340 535 292 570 292" marker-end="url(#arrow)" />
  <text class="small" x="508" y="330">miss</text>

  <path class="edge" d="M610 460 V510" marker-end="url(#arrow)" />
  <path class="edge" d="M800 460 V510" marker-end="url(#arrow)" />
  <text class="small" x="622" y="490">API reads, cron writes</text>

  <path class="edge" d="M840 372 C890 372 890 250 940 250" marker-end="url(#arrow)" />
  <text class="small" x="948" y="302">geocode new venues</text>
  <path class="edge" d="M840 404 C890 404 890 380 940 380" marker-end="url(#arrow)" />
  <text class="small" x="948" y="442">fixtures by month</text>

  <path class="edge" d="M220 580 C400 580 400 440 540 440" marker-end="url(#arrow)" />
  <text class="small" x="300" y="600">deploy on merge</text>

  <rect class="node input" x="40" y="170" width="180" height="80" rx="8" />
  <text class="label" x="64" y="204">Browser</text>
  <text class="small" x="64" y="226">React app</text>

  <rect class="node input" x="40" y="330" width="180" height="70" rx="8" />
  <text class="label" x="64" y="361">Calendar apps</text>
  <text class="small" x="64" y="382">subscribe to /t/id.ics</text>

  <rect class="node neutral" x="40" y="540" width="180" height="80" rx="8" />
  <text class="label" x="64" y="573">GitHub Actions</text>
  <text class="small" x="64" y="595">D1 migrations, then deploy</text>

  <rect class="node risk" x="300" y="150" width="200" height="96" rx="8" />
  <text class="label" x="324" y="190">WAF</text>
  <text class="small" x="324" y="212">rate limiting and WAF rules</text>

  <rect class="node storage" x="300" y="300" width="200" height="80" rx="8" />
  <text class="label" x="324" y="334">Edge cache</text>
  <text class="small" x="324" y="356">most API responses</text>

  <rect class="node process" x="570" y="166" width="270" height="60" rx="8" />
  <text class="label" x="594" y="192">Static assets</text>
  <text class="small" x="594" y="212">React build · no code runs</text>

  <rect class="node process" x="570" y="250" width="270" height="84" rx="8" />
  <text class="label" x="594" y="278">API · Hono</text>
  <text class="small" x="594" y="300">/api/* · /img/* · /t/*</text>
  <text class="small" x="594" y="318">Zod validation · per-IP limiters</text>

  <rect class="node process" x="570" y="358" width="270" height="76" rx="8" />
  <text class="label" x="594" y="388">Cron handler</text>
  <text class="small" x="594" y="410">fetches data every minute</text>

  <path class="node storage" d="M570 520 V610 A65 10 0 0 0 700 610 V520 Z" />
  <ellipse class="node storage" cx="635" cy="520" rx="65" ry="10" />
  <text class="label" x="594" y="552">D1 (SQLite)</text>
  <text class="small" x="594" y="572">fixtures, venues</text>
  <text class="small" x="594" y="589">trips</text>
  <text class="small" x="594" y="606">ingest queue</text>

  <path class="node storage" d="M720 520 V610 A65 10 0 0 0 850 610 V520 Z" />
  <ellipse class="node storage" cx="785" cy="520" rx="65" ry="10" />
  <text class="label" x="744" y="552">R2 Bucket</text>
  <text class="small" x="744" y="572">club and</text>
  <text class="small" x="744" y="589">competition</text>
  <text class="small" x="744" y="606">crests</text>

  <rect class="node external" x="940" y="110" width="160" height="60" rx="8" />
  <text class="label" x="964" y="146">Esri basemaps</text>

  <rect class="node external" x="940" y="200" width="200" height="80" rx="8" />
  <text class="label" x="964" y="232">Photon</text>
  <text class="small" x="964" y="254">OpenStreetMap geocoder</text>

  <rect class="node external" x="940" y="340" width="200" height="80" rx="8" />
  <text class="label" x="964" y="372">ESPN</text>
  <text class="small" x="964" y="394">public scoreboard API</text>

  <text class="zone-label" x="940" y="560">KEY</text>
  <rect class="node input" x="940" y="574" width="14" height="14" rx="3" />
  <text class="small" x="962" y="586">visitors</text>
  <rect class="node risk" x="1040" y="574" width="14" height="14" rx="3" />
  <text class="small" x="1062" y="586">WAF</text>
  <rect class="node process" x="940" y="600" width="14" height="14" rx="3" />
  <text class="small" x="962" y="612">Worker code</text>
  <rect class="node storage" x="1040" y="600" width="14" height="14" rx="3" />
  <text class="small" x="1062" y="612">storage</text>
  <rect class="node external" x="940" y="626" width="14" height="14" rx="3" />
  <text class="small" x="962" y="638">outside services</text>
  <path class="edge direct" d="M1040 633 H1070" />
  <text class="small" x="1078" y="638">from browser</text>
</svg>
